[package]
name = "perp-rust"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = "0.5.3"
axum = "0.8.9"
chrono = "0.4.44"
dotenvy = "0.15.7"
jsonwebtoken = { version = "10.4.0", features = ["rust_crypto"] }
serde = "1.0.228"
serde_json = "1.0.149"
sqlx = { version = "0.8.6", features = ["postgres", "runtime-tokio-rustls"] }
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread"] }
tower-http = "0.6.10"
uuid = "1.23.1"
redis-client = { path = "../libs/redis-client" }
