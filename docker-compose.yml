version: "3.9"

services:

  redis:
    image: redis:7
    container_name: perp-redis
    ports:
      - "6379:6379"

  postgres:
    image: postgres:17
    container_name: perp-postgres
    restart: always

    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: perps

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: